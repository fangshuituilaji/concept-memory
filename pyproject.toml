[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-system"
version = "0.4.0"
description = "A local, explainable concept memory system for coding agents"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-c>=0.24.2,<0.25",
    "tree-sitter-c-sharp>=0.23.5,<0.24",
    "tree-sitter-cpp>=0.23.4,<0.24",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-rust>=0.24.2,<0.25",
    "tree-sitter-typescript>=0.23.2,<0.24",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8"]
dashscope = ["dashscope"]
tree-sitter = [
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.20",
    "tree-sitter-typescript>=0.20",
    "tree-sitter-javascript>=0.20",
]

[project.scripts]
memory-concepts = "memory_system.cli:main"
memory-mcp = "memory_system.mcp_server:main"
memory-web = "memory_system.web_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
