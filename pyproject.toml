[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-system"
version = "0.1.0"
description = "A local, explainable concept memory system for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dashscope = ["dashscope"]

[project.scripts]
memory-concepts = "memory_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
